# Heltec WiFi LoRa 32 V4 (ESP32-S3FN8 + SX1262, 863-928 MHz), ExpressLRS 3.5.6.
# Copy into ExpressLRS/src/targets; firmware/integrate.py installs the
# receive-only SX126x driver (lib/SX126xDriver), the RADIO_SX126X hooks and
# boards/heltec_wifi_lora_32_V4.json that this target depends on. Pair it with
# the Heltec hardware JSON. The build needs a primary sub-GHz domain in
# user_defines.txt (e.g. Regulatory_Domain_EU_868); the web UI can change the
# frequency plan afterwards.
#
# Receivable ExpressLRS rates: 25 Hz, 50 Hz and 100 Hz LoRa from SX127x or
# LR1121 transmitters, plus the LR1121-only 250 Hz and 200 Hz full-resolution
# SF5 modes. An SX126x cannot demodulate the SX127x-style SF6 used by 200 Hz,
# 100 Hz full resolution and D50, and this board has no 2.4 GHz path.

[radio_SX126X]
build_flags = -DRADIO_SX126X=1
lib_ignore =
	SX127xDriver
	SX1280Driver
	LR1121Driver

[heltec_v4_sniffer]
extends = env_common_esp32s3rx, radio_SX126X
board = heltec_wifi_lora_32_V4
# The vendor board definition names an Arduino variant that the pinned core
# 2.0.11 does not ship and enables USB CDC on boot, which renames USBSerial.
# All pins come from the runtime hardware layout, so the generic ESP32-S3
# variant and the stock ESP32-S3 USB flags are used instead.
board_build.variant = esp32s3
board_build.extra_flags = -DARDUINO_USB_MODE=1 -DARDUINO_RUNNING_CORE=1 -DARDUINO_EVENT_RUNNING_CORE=1
monitor_speed = 460800
build_flags =
	${env_common_esp32s3rx.build_flags}
	${radio_SX126X.build_flags}
	${common_env_data.build_flags_rx}
	-include target/Unified_ESP_RX.h
	-D GHOST_SNIFFER=1
	-D GHOST_NO_TX=1
	-D GHOST_TRANSPORT_SERIAL=1
	# SX1262 DIO3 powers the module TCXO at 1.8 V (code 2); DIO2 selects the
	# front-end TX/RX path. Front-end enable lines come from the hardware JSON.
	-D GHOST_SX126X_TCXO=2
	-D GHOST_SX126X_DIO2_RFSW=1
	-D GHOST_DISPLAY=1
	# 0.96in SSD1315 (SSD1306 compatible) on SDA17/SCL18, reset GPIO21,
	# powered through Vext on GPIO36 (active low).
	-D GHOST_OLED_SDA=17
	-D GHOST_OLED_SCL=18
	-D GHOST_OLED_RST=21
	-D GHOST_OLED_PWR_PIN=36
	-D GHOST_OLED_PWR_ON=0
	-D CORE_DEBUG_LEVEL=0
lib_deps = ${env_common_esp32.oled_lib_deps}
lib_ignore = ${radio_SX126X.lib_ignore}
build_src_filter = ${env_common_esp32s3rx.build_src_filter} -<tx_*.cpp>

# Diagnostic firmware: boot/radio/link logs plus [CRSF] hex lines.
[env:Heltec_V4_Sniffer_900_RX_Serial]
extends = heltec_v4_sniffer
build_flags =
	${heltec_v4_sniffer.build_flags}
	-D GHOST_SERIAL_HEX=1
	-D DEBUG_LOG=1

# Production stream: binary [address][length][type][payload][CRC] frames.
# DEBUG_LOG and GHOST_SERIAL_HEX must stay disabled for a clean USB stream.
[env:Heltec_V4_Sniffer_900_RX_USB]
extends = heltec_v4_sniffer
build_flags =
	${heltec_v4_sniffer.build_flags}
	-D GHOST_SERIAL_RAW=1
