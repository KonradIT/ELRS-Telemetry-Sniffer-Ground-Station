# LILYGO T3-S3 LR1121 (non-PA), ExpressLRS 3.5.6.
# Copy into ExpressLRS/src/targets; pair with the LR1121 hardware JSON.
# firmware/integrate.py supplies the TCXO and receive-only driver hooks.
# The LR1121 build needs a primary sub-GHz domain in user_defines.txt
# (e.g. Regulatory_Domain_EU_868). GHOST_LR1121_2400_ONLY restricts reception
# to the separate 2.4 GHz LoRa rate/hopping table. SX1280 FLRC is unsupported.

[t3s3_lr1121_sniffer]
extends = env_common_esp32s3rx, radio_LR1121
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_upload.maximum_size = 4194304
monitor_speed = 460800
build_flags =
	${env_common_esp32s3rx.build_flags}
	${radio_LR1121.build_flags}
	${common_env_data.build_flags_rx}
	-include target/Unified_ESP_RX.h
	-D GHOST_SNIFFER=1
	-D GHOST_NO_TX=1
	-D GHOST_TRANSPORT_SERIAL=1
	-D GHOST_LR1121_2400_ONLY=1
	-D GHOST_LR1121_TCXO=6
	-D GHOST_DISPLAY=1
	-D CORE_DEBUG_LEVEL=0
# Keep the stock board USB flags (hardware USB Serial/JTAG). Do not enable
# ARDUINO_USB_CDC_ON_BOOT: ELRS needs USBSerial for USB and Serial for UART0.
lib_deps = ${env_common_esp32.oled_lib_deps}
lib_ignore = ${radio_LR1121.lib_ignore}
build_src_filter = ${env_common_esp32s3rx.build_src_filter} -<tx_*.cpp>

# Diagnostic firmware: boot/radio/link logs plus [CRSF] hex lines.
[env:T3S3_Sniffer_LR1121_RX_Serial]
extends = t3s3_lr1121_sniffer
build_flags =
	${t3s3_lr1121_sniffer.build_flags}
	-D GHOST_SERIAL_HEX=1
	-D DEBUG_LOG=1

# Production stream: binary [address][length][type][payload][CRC] frames.
# DEBUG_LOG and GHOST_SERIAL_HEX must stay disabled for a clean USB stream.
[env:T3S3_Sniffer_LR1121_RX_USB]
extends = t3s3_lr1121_sniffer
build_flags =
	${t3s3_lr1121_sniffer.build_flags}
	-D GHOST_SERIAL_RAW=1
